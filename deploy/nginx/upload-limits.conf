# Include inside the server { } block for the Diamond PBN dashboard (e.g. pbn.w3scloud.com).
# Default nginx client_max_body_size is 1M — plugin ZIP uploads need more.
#
# Ubuntu/Debian example:
#   sudo nano /etc/nginx/sites-available/diamondpbn
#   add:  include /var/www/pbn_automation_software/deploy/nginx/upload-limits.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Also ensure PHP-FPM allows uploads (php.ini or public/.user.ini):
#   upload_max_filesize = 12M
#   post_max_size = 14M
#   sudo systemctl reload php8.2-fpm

client_max_body_size 12M;
