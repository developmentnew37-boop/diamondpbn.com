; ==============================
; 13. Bulk Retry (all campaign types)
; ==============================
[program:diamondpbn-bulk-retry-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/diamondpbn/artisan queue:work database --queue=bulk_retry,bulk_retry_hidden_links_campaigns,bulk_retry_scheduled_campaigns,bulk_retry_scheduled_sidebar_campaigns,bulk_retry_sidebar_campaigns --sleep=1 --tries=3 --timeout=1800 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/diamondpbn/storage/logs/supervisor-bulk-retry.log
stopwaitsecs=3600

; ==============================
; 14. Laravel Scheduler
; (dispatches due schedule posts, conversion sync, webhook rotation, domain health check, etc.)
; Does NOT run queue:work — all queues above have dedicated persistent workers.
; ==============================
[program:laravel-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /var/www/diamondpbn/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/diamondpbn/storage/logs/scheduler.log
stopwaitsecs=60
