; Diamond PBN — production Supervisor queue workers
; Path: /var/www/diamondpbn  |  user: www-data
;
; All queues covered (14 workers + scheduler):
;   campaigns, bulk_updates, deletions
;   sidebar_campaigns, bulk_blogroll_updates, sidebar_deletions
;   hidden_links_campaigns, update_hidden_links, delete_hidden_links, delete_hidden_links_campaign
;   scheduled_campaigns, campaign_conversions, schedule_campaign_bulk_updates, schedule_campaign_deletions
;   scheduled_sidebar_campaigns, sidebar_campaign_conversions, schedule_sidebar_bulk_updates, schedule_sidebar_deletions
;   wp_scheduled_campaigns, wp_scheduled_sync, wp_scheduled_campaign_deletions, wp_scheduled_campaign_bulk_updates
;   domainCheck, domainHealthSync
;   webhook-secret, plugin_deployments, default
;   article_permanent_purge, article_restore
;   bulk_retry, bulk_retry_hidden_links_campaigns, bulk_retry_scheduled_campaigns,
;   bulk_retry_scheduled_sidebar_campaigns, bulk_retry_sidebar_campaigns
;
; Production .env:
;   QUEUE_CONNECTION=database
;   DB_QUEUE_RETRY_AFTER=3900
;
; Worker --timeout must be >= longest job on that queue (see app/Jobs/* $timeout).

; ==============================
; 1. Campaign PBN Jobs
; ==============================
[program:campaigns-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/diamondpbn/artisan queue:work database --queue=campaigns,bulk_updates,deletions --sleep=1 --tries=3 --timeout=3600 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/diamondpbn/storage/logs/campaigns-worker.log
stopwaitsecs=3600

