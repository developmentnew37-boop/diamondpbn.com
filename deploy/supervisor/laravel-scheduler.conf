; Laravel task scheduler — required for:
;   - dispatch_scheduled_campaign_posts (every minute)
;   - dispatch_scheduled_sidebar_campaign_tasks (every minute)
;   - refresh_webhook_secrets (hourly → webhook-secret queue)
;   - wp-scheduled:sync-status, prune domain checks, etc.
;
; Without this (or system cron: * * * * * php artisan schedule:run),
; queue workers never receive scheduled jobs — they only process jobs already in the jobs table.

[program:laravel-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /var/www/diamondpbn/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/diamondpbn/storage/logs/scheduler.log
stopwaitsecs=60
