; Lightweight worker for scheduled webhook secret rotation only.
; Job: RefreshWebhookSecretsJob (routes/console.php — every 8 hours)
; One process is enough — work is a few DB updates, runs ~3× per day.

[program:laravel-webhook-worker]
process_name=%(program_name)s
command=php /var/www/pbn_automation_software/artisan queue:work database --queue=webhook-secret --sleep=10 --tries=1 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/pbn_automation_software/storage/logs/webhook-worker.log
stopwaitsecs=120
